<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Toko banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#132943"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1f2a44" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Geometric shapes -->
  <g opacity="0.8">
    <circle cx="1000" cy="-20" r="220" fill="url(#accent)" opacity="0.2"/>
    <circle cx="160" cy="360" r="180" fill="url(#accent)" opacity="0.14"/>
    <polygon points="860,40 1020,120 920,260 760,180" fill="#38bdf8" opacity="0.2"/>
    <polygon points="120,60 220,140 160,220 40,140" fill="#f59e0b" opacity="0.18"/>
    <rect x="720" y="220" width="120" height="120" rx="20" fill="url(#accentWarm)" opacity="0.22"/>
    <rect x="240" y="210" width="90" height="90" rx="16" fill="#22c55e" opacity="0.18"/>
  </g>

  <!-- Concentric lines -->
  <g fill="none" stroke="#23304a" stroke-width="2" opacity="0.6" filter="url(#soft)">
    <circle cx="920" cy="100" r="56"/>
    <circle cx="920" cy="100" r="80"/>
    <circle cx="920" cy="100" r="104"/>
  </g>

  <!-- Title block -->
  <rect x="96" y="84" width="72" height="72" rx="16" fill="url(#accent)"/>
  <rect x="112" y="100" width="40" height="40" rx="10" fill="#0b1020" opacity="0.55"/>

  <text x="200" y="130" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="56" font-weight="700" fill="#e2e8f0">Toko</text>
  <text x="200" y="180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="22" fill="#cbd5f5">Article Management Models for Laravel</text>

  <rect x="200" y="210" width="420" height="4" rx="2" fill="url(#accent)"/>
  <text x="200" y="252" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#9fb5d8">Categories · Revisions · Publishing · Status Tracking</text>
</svg>
