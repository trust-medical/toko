name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            laravel: "12.*"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "12.*"
            testbench: "^10.0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --prefer-dist --no-update
          composer update --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run lint
        run: composer lint

      - name: Run static analysis
        run: composer analyze
